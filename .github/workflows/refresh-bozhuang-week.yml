name: Refresh bozhuang week

# 博庄周期（周/月/季/年）+ MACD周期（周/月/季/年）收盘快照。真正的
# 15:02 触发来自 Cloudflare Worker (deploy/cloudflare/worker.js)；这里的
# schedule 只做两件事：
#   1. GitHub 偶尔准时（15:10）时作为第一轮的后备；
#   2. GitHub 排到晚上（实测 7-9 小时延迟）时作为夜间兜底。
# workflow 是幂等的：两组今天都已经发布过就只做一次 verify 然后退出。
on:
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: refresh-bozhuang-week
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: wangyuhong425301/stock-capital-miniprogram
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: private
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: private/package-lock.json

      - name: Install dependencies
        working-directory: private
        run: npm install --no-audit --no-fund

      - name: Check trading day and existing publication
        id: gate
        working-directory: private
        run: |
          expected="$(node -e "process.stdout.write(require('./scripts/update-band-strategy-picks').expectedBandTradeDate())")"
          today="$(date +%F)"
          echo "expected=${expected} today=${today}"
          if [ "$expected" != "$today" ]; then
            echo "not a trading day for the close session; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bozhuang_ok=false
          yearline_ok=false
          if node scripts/verify-bozhuang-week-picks.js \
            --expected-date "$expected" \
            --session close >/dev/null 2>&1; then
            bozhuang_ok=true
          fi
          if node scripts/verify-yearline-watch-picks.js \
            --expected-date "$expected" \
            --session close >/dev/null 2>&1; then
            yearline_ok=true
          fi
          echo "bozhuang=${bozhuang_ok} yearline=${yearline_ok}"
          if [ "$bozhuang_ok" = true ] && [ "$yearline_ok" = true ]; then
            echo "close picks already published for ${expected}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Wait for the daily close to settle
        if: steps.gate.outputs.skip != 'true'
        working-directory: private
        run: |
          expected="$(node -e "process.stdout.write(require('./scripts/update-band-strategy-picks').expectedBandTradeDate())")"
          # Five active names across both exchanges. 4/5 is enough: one of
          # them can be halted without blocking the whole market scan.
          deadline="1517"
          for attempt in $(seq 1 40); do
            probe="$(node scripts/update-bozhuang-week-picks.js \
              --session=close \
              --quiet \
              --stocks=000001,600519,600036,000858,601318 2>/dev/null || true)"
            fresh="$(printf '%s\n' "$probe" | grep -c "date=${expected}")"
            echo "close probe ${attempt}: ${fresh}/5 fresh at $(date +%H:%M:%S)"
            if [ "$fresh" -ge 4 ]; then
              exit 0
            fi
            if [ "$(date +%H%M)" -ge "$deadline" ]; then
              echo "close data did not settle before ${deadline}; refusing to publish"
              exit 1
            fi
            sleep 20
          done
          exit 1

      - name: Refresh close picks
        if: steps.gate.outputs.skip != 'true'
        working-directory: private
        run: |
          # 一轮全市场扫描同时产出博庄周期（周/月/季/年）与 MACD周期
          # （周/月/季/年）；两组各自过发布闸门，闸门不满足时只保留昨日
          # 快照，不互相拖挂。
          node scripts/update-bozhuang-week-picks.js --session=close --concurrency=32

      - name: Verify bozhuang publication gate
        id: verify_bozhuang
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        working-directory: private
        run: |
          expected="$(node -e "process.stdout.write(require('./scripts/update-band-strategy-picks').expectedBandTradeDate())")"
          node scripts/verify-bozhuang-week-picks.js \
            --expected-date "$expected" \
            --session close

      - name: Verify yearline publication gate
        id: verify_yearline
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        working-directory: private
        run: |
          expected="$(node -e "process.stdout.write(require('./scripts/update-band-strategy-picks').expectedBandTradeDate())")"
          node scripts/verify-yearline-watch-picks.js \
            --expected-date "$expected" \
            --session close

      - name: Commit and push
        if: always() && steps.gate.outputs.skip != 'true'
        working-directory: private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          added=false
          if [ "${{ steps.verify_bozhuang.outcome }}" = "success" ]; then
            git add public/data/bozhuang-week-picks.json
            # 最新一天不再重复落历史文件，首日目录可能不存在。
            if [ -d public/data/bozhuang-week ]; then
              git add public/data/bozhuang-week
            fi
            added=true
          fi
          if [ "${{ steps.verify_yearline.outcome }}" = "success" ]; then
            if [ -e public/data/yearline-watch-picks.json ]; then
              git add public/data/yearline-watch-picks.json
            fi
            if [ -d public/data/yearline-watch ]; then
              git add public/data/yearline-watch
            fi
            added=true
          fi
          if [ "$added" != true ]; then
            echo "no verified snapshot to publish"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "no close pick changes"
            exit 0
          fi
          git commit -m "chore: refresh picks data"
          # npm/TDX helpers can leave a tracked file dirty after the data
          # commit (the private workflow has the same guard). Stash it so the
          # rebase is allowed; the picks files are already committed.
          if ! git diff --quiet; then
            git status --porcelain
            git stash push --include-untracked --message "uncommitted refresh output"
          fi
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done

      - name: Fail when a snapshot is stale
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ steps.verify_bozhuang.outcome }}" != "success" ]; then
            echo "::error::bozhuang week snapshot is not publishable"
            exit 1
          fi
          if [ "${{ steps.verify_yearline.outcome }}" != "success" ]; then
            echo "::error::yearline watch snapshot is not publishable"
            exit 1
          fi
