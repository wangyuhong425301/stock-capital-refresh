name: Refresh band checkpoints

on:
  workflow_dispatch:
  schedule:
    # Asia/Shanghai session checkpoints:
    # 11:40 full morning scan, 14:01 candidate afternoon scan, 15:02 full close.
    - cron: '40 3 * * 1-5'
    - cron: '1 6 * * 1-5'
    - cron: '2 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: refresh-band-checkpoints
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEEK_MONTH_CONCURRENCY: 24
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: wangyuhong425301/stock-capital-miniprogram
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: private
          fetch-depth: 0

      - name: Refresh band checkpoint
        id: refresh_band_checkpoint
        working-directory: private
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '40 3 * * 1-5')
              args=(--latest-only --session=morning --full)
              ;;
            '1 6 * * 1-5')
              args=(--latest-only --session=afternoon --candidate-only)
              ;;
            *)
              args=(--latest-only --session=close --full)
              ;;
          esac
          node scripts/update-band-strategy-picks.js "${args[@]}"

      - name: Verify band checkpoint
        working-directory: private
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          expected_band_date="$(node -e "process.stdout.write(require('./scripts/update-band-strategy-picks').expectedBandTradeDate())")"
          case "$SCHEDULE" in
            '40 3 * * 1-5') session=morning ;;
            '1 6 * * 1-5') session=afternoon ;;
            *) session=close ;;
          esac
          node scripts/verify-band-strategy-publication.js --expected-date "$expected_band_date" --session "$session"

      - name: Commit and push
        working-directory: private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/band-strategy-picks.json public/data/band-strategy-summary.json
          if git diff --cached --quiet; then
            echo "No band changes"
            exit 0
          fi
          git commit -m "chore: refresh picks data"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
