name: Refresh sector close snapshot

on:
  workflow_dispatch:
  schedule:
    # 15:30 Asia/Shanghai on trading weekdays.
    - cron: '30 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: refresh-sector-close
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TDX_STOCK_CLOSE_CACHE_DIR: .vercel/cache/stock-k-close-bars
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: wangyuhong425301/stock-capital-miniprogram
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: private
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh sector baseline
        working-directory: private
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/generate-tdx-sector-baseline.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Tongdaxin close bars are not ready; retrying in 3 minutes ($attempt/3)"
            sleep 180
          done

      - name: Refresh sector member K snapshot
        working-directory: private
        run: |
          for attempt in 1 2; do
            if python3 scripts/generate-tdx-sector-members.py; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "Tongdaxin member snapshot refresh failed; retrying in 1 minute"
            sleep 60
          done

      - name: Verify publication
        working-directory: private
        run: |
          expected_close_date="$(python3 -c "import sys; sys.path.insert(0, 'api'); import tdx_sector; print(tdx_sector.expected_close_trade_date())")"
          node scripts/verify-tdx-sector-publication.js --expected-date "$expected_close_date"

      - name: Commit and push
        working-directory: private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/tdx-sector-baseline.json api/tdx-sector-member-map.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: refresh market close snapshots"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
