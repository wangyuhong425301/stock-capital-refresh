name: Refresh sector close snapshot

on:
  workflow_dispatch:
  schedule:
    # 15:30 Asia/Shanghai close snapshots. The market review runs in the
    # separate refresh-market-review workflow.
    - cron: '30 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: refresh-sector-close
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TDX_STOCK_CLOSE_CACHE_DIR: .vercel/cache/stock-k-close-bars
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: wangyuhong425301/stock-capital-miniprogram
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: private
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh sector baseline
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * 1-5'
        working-directory: private
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/generate-tdx-sector-baseline.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Tongdaxin close bars are not ready; retrying in 3 minutes ($attempt/3)"
            sleep 180
          done

      - name: Refresh sector member K snapshot
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * 1-5'
        working-directory: private
        run: |
          for attempt in 1 2; do
            if python3 scripts/generate-tdx-sector-members.py; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "Tongdaxin member snapshot refresh failed; retrying in 1 minute"
            sleep 60
          done

      - name: Refresh sector member 5m/15m K snapshot
        id: refresh_sector_short_k
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * 1-5'
        continue-on-error: true
        working-directory: private
        run: node scripts/update-tdx-sector-short-k.js

      - name: Refresh home index close snapshot
        id: refresh_home_index_close
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * 1-5'
        continue-on-error: true
        working-directory: private
        run: |
          for attempt in 1 2 3; do
            if node scripts/generate-home-index-close.js; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Home index close snapshot is not ready; retrying in 30 seconds"
            sleep 30
          done

      - name: Verify publication
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * 1-5'
        working-directory: private
        run: |
          expected_close_date="$(python3 -c "import sys; sys.path.insert(0, 'api'); import tdx_sector; print(tdx_sector.expected_close_trade_date())")"
          node scripts/verify-tdx-sector-publication.js --expected-date "$expected_close_date"

      - name: Refresh band strategy close snapshot
        id: refresh_band_close
        continue-on-error: true
        working-directory: private
        run: node scripts/update-band-strategy-picks.js --latest-only --session=close --full

      - name: Verify band close snapshot
        id: verify_band_close
        if: always() && steps.refresh_band_close.outcome == 'success'
        continue-on-error: true
        working-directory: private
        run: |
          expected_band_date="$(node -e "process.stdout.write(require('./scripts/update-band-strategy-picks').expectedBandTradeDate())")"
          node scripts/verify-band-strategy-publication.js --expected-date "$expected_band_date" --session close

      - name: Commit and push
        working-directory: private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.refresh_sector_short_k.outcome }}" = "success" ]; then
            git add api/tdx-sector-member-map.json
          else
            echo "Short-K snapshot failed or was skipped; keeping the previous member map"
            git checkout -- api/tdx-sector-member-map.json || true
          fi
          git add api/tdx-sector-baseline.json
          if [ "${{ steps.refresh_home_index_close.outcome }}" = "success" ]; then
            git add public/data/home-index-close.json
          fi
          if [ "${{ steps.refresh_band_close.outcome }}" = "success" ] && [ "${{ steps.verify_band_close.outcome }}" = "success" ]; then
            git add public/data/band-strategy-picks.json public/data/band-strategy-summary.json
          else
            echo "Band close snapshot failed or was skipped; keeping the previous band files"
            git checkout -- public/data/band-strategy-picks.json public/data/band-strategy-summary.json || true
          fi
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: refresh market close snapshots"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done

      - name: Report refresh failure
        if: always() && (steps.refresh_sector_short_k.outcome == 'failure' || steps.refresh_home_index_close.outcome == 'failure' || steps.refresh_band_close.outcome == 'failure' || steps.verify_band_close.outcome == 'failure')
        run: exit 1
