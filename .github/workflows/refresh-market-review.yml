name: Refresh market review

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'morning / afternoon / close (blank = infer from time)'
        required: false
        default: ''
  schedule:
    # 11:35 morning; 15:02/15:12 close (both wait for the 15:10 close gate);
    # 15:30 and 16:10 are backups that skip an already captured close.
    - cron: '35 3 * * 1-5'
    - cron: '2 7 * * 1-5'
    - cron: '12 7 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '10 8 * * 1-5'

permissions:
  contents: read

concurrency:
  group: refresh-market-review
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: wangyuhong425301/stock-capital-miniprogram
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: private
          fetch-depth: 0

      - name: Refresh market review
        id: refresh
        working-directory: private
        env:
          # When this US runner cannot reach eastmoney/kaipanhong, the data layer
          # replays the same GETs through the Asia-region quote proxy instead of
          # losing the only close snapshot of the day.
          MARKET_REVIEW_PROXY_URL: ${{ vars.MARKET_REVIEW_PROXY_URL || 'https://stock.kings-w.site/api/quote-proxy' }}
          MARKET_REVIEW_PROXY_TOKEN: ${{ secrets.MARKET_REVIEW_PROXY_TOKEN }}
          MARKET_REVIEW_FORCE_PROXY: ${{ vars.MARKET_REVIEW_FORCE_PROXY }}
        run: |
          case "${{ github.event.inputs.session }}" in
            morning|afternoon|close) market_review_session="${{ github.event.inputs.session }}" ;;
            *)
              case "${{ github.event.schedule }}" in
                '35 3 * * 1-5') market_review_session='morning' ;;
                '2 7 * * 1-5'|'12 7 * * 1-5'|'30 7 * * 1-5'|'10 8 * * 1-5') market_review_session='close' ;;
                *) market_review_session="$(node scripts/verify-market-review-publication.js --print-expected-session)" ;;
              esac
              ;;
          esac
          expected_market_review_date="$(node scripts/verify-market-review-publication.js --print-expected-date)"
          if [ "$market_review_session" = "close" ]; then
            guard_result="$(node scripts/market-review-close-guard.js --wait --skip-if-complete --expected-date "$expected_market_review_date")"
            echo "$guard_result"
            if echo "$guard_result" | grep -qx 'skip=1'; then
              echo "session=close" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          for attempt in 1 2 3 4 5; do
            if node scripts/update-market-review.js \
              && node scripts/verify-market-review-publication.js \
                --expected-date "$expected_market_review_date" \
                --session "$market_review_session"; then
              echo "session=$market_review_session" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            echo "Market review refresh/publication validation failed; retrying in 45 seconds ($attempt/5)"
            sleep 45
          done

      - name: Commit and push
        working-directory: private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market-review.json \
            public/data/market-review-summary.json \
            public/data/market-review-summary-lite.json \
            public/data/market-review-catalog.json
          if git diff --cached --quiet; then
            echo "No market review changes"
            exit 0
          fi
          git commit -m "chore: refresh market review ${{ steps.refresh.outputs.session }}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
