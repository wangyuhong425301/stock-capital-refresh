name: Probe market data proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe proxy and direct upstreams
        env:
          PROXY_TOKEN: ${{ secrets.MARKET_REVIEW_PROXY_TOKEN }}
        run: |
          set +e
          BASE="https://stock.kings-w.site/api/quote-proxy"
          probe() {
            host="$1"; path="$2"
            enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$path")
            echo "== proxy $host"
            curl -sS -m 40 -o /tmp/proxy_body -w "proxy HTTP %{http_code} %{time_total}s %{size_download}B\n" \
              -H "Authorization: Bearer $PROXY_TOKEN" "$BASE?host=$host&path=$enc"
            head -c 180 /tmp/proxy_body; echo
            echo "== direct $host"
            curl -sS -m 40 -o /tmp/direct_body -w "direct HTTP %{http_code} %{time_total}s %{size_download}B\n" \
              -H "Referer: https://quote.eastmoney.com/center/gridlist.html" -H "User-Agent: Mozilla/5.0" \
              "https://$host$path"
            head -c 180 /tmp/direct_body; echo
          }
          probe push2.eastmoney.com "/api/qt/clist/get?pn=1&pz=2&po=1&np=1&fltt=2&invt=2&fid=f62&fs=m:90+t:2&fields=f12,f14"
          probe push2delay.eastmoney.com "/api/qt/clist/get?pn=1&pz=2&po=1&np=1&fltt=2&invt=2&fid=f62&fs=m:90+t:2&fields=f12,f14"
          probe push2his.eastmoney.com "/api/qt/stock/kline/get?secid=1.000001&klt=101&fqt=0&lmt=3&fields1=f1,f2,f3&fields2=f51,f53"
          echo "== proxy kaipanhong"
          curl -sS -m 40 -o /tmp/kph -w "proxy HTTP %{http_code} %{time_total}s %{size_download}B\n" \
            -H "Authorization: Bearer $PROXY_TOKEN" \
            "$BASE?host=apphwshhq.kaipanhong.com&path=%2Fw1%2Fapi%2Findex.php%3FPhoneOSNew%3D1%26DeviceID%3D1%26VerSion%3D6.0.6%26Token%3D0%26UserID%3D0%26Red%3D1%26apiv%3Dw45"
          head -c 180 /tmp/kph; echo
